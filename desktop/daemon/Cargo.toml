[package]
name = "phonelink-desktop"
description = "EchoTwin Linux daemon (phonelinkd) and command-line client (phonelink)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "phonelinkd"
path = "src/bin/phonelinkd.rs"

[[bin]]
name = "phonelink"
path = "src/bin/phonelink.rs"

[dependencies]
phonelink-core = { path = "../../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
qrcode = { version = "0.14", default-features = false }
if-addrs = "0.15"
# Desktop popups over D-Bus (pure Rust). One long-lived connection, so clicks come back to us.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# Copied pictures (Wayland data-control on KDE, X11 elsewhere), sent losslessly as PNG.
arboard = { version = "3", features = ["wayland-data-control"] }
png = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
