[package]
name = "phonelink-ffi"
description = "UniFFI bindings exposing the EchoTwin core to Kotlin (Android)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "phonelink_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
phonelink-core = { path = "../core" }
uniffi = "0.32"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"
tracing = "0.1"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
