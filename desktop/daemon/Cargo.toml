[package]
name = "phonelink-desktop"
description = "PhoneLink Linux daemon (phonelinkd) and command-line client (phonelink)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "phonelinkd"
path = "src/bin/phonelinkd.rs"

[[bin]]
name = "phonelink"
path = "src/bin/phonelink.rs"

[dependencies]
phonelink-core = { path = "../../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
qrcode = { version = "0.14", default-features = false }
if-addrs = "0.15"
notify-rust = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
