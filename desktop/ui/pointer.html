<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EchoTwin pointer</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #p { position: absolute; left: 0; top: 0; border-radius: 50%; pointer-events: none; will-change: transform; }
    #p[hidden], #shade[hidden] { display: none; }
    /* Spotlight: the page darkens, with a clear circle around the pointer. */
    #shade { position: absolute; inset: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="shade" hidden></div>
  <div id="p" hidden></div>
  <script src="pointer.js"></script>
</body>
</html>
