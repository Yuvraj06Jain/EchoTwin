[package]
name = "phonelink-app"
description = "PhoneLink desktop window (Tauri). The background service is phonelinkd."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "phonelink-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
phonelink-desktop = { path = "../daemon" }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
# A second launch (e.g. clicking a popup) brings the open window forward instead.
tauri-plugin-single-instance = "2"
# The "Choose files" picker (called from Rust only; the page gets no dialog permission).
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Same versions Tauri already uses: hand the activation token to GTK so Wayland lets the
# window take focus.
gtk = "0.18"
libc = "0.2"

[features]
# Embed the UI in the binary and serve it over Tauri's own protocol (no dev server, no
# localhost). Always on: this project has no separate front-end dev server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
